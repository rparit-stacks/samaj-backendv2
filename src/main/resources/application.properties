# ─────────────────────────────────────────────────────────
# Redis cache (Spring Cache)
#
# NOTE: Do not commit real credentials. Use environment variable:
#   SAMAJ_REDIS_URL=rediss://default:<password>@<host>:<port>
# The given Redis Cloud host typically requires TLS; use rediss://.
# ─────────────────────────────────────────────────────────
spring.cache.type=redis
spring.data.redis.url=${SAMAJ_REDIS_URL:redis://default:0RfFSdGUbxvXSKXgPphUcsBmsNJSeI90@redis-18745.c263.us-east-1-2.ec2.cloud.redislabs.com:18745}
spring.data.redis.timeout=3s
# IMPORTANT:
# - If endpoint supports TLS: use `rediss://...` OR set `SAMAJ_REDIS_SSL=true`
# - If endpoint is non‑TLS: use `redis://...` AND keep `SAMAJ_REDIS_SSL=false`
spring.data.redis.ssl.enabled=${SAMAJ_REDIS_SSL:false}

# Avoid old cached values written by previous serializer/key formats.
spring.cache.redis.key-prefix=samaj:v2:
spring.cache.redis.use-key-prefix=true

#spring.datasource.url=jdbc:postgresql://13.60.97.231:5432/samaj_app
spring.datasource.url=jdbc:postgresql://72.62.241.163/samaj_user

spring.datasource.username=samaj
spring.datasource.password=StrongPassword123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway owns schema changes (indexes, new columns). Existing DBs are baselined at 0 so V1 still runs.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

