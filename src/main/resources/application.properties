# ─────────────────────────────────────────────────────────
# Firebase Cloud Messaging (push notifications)
# Used by FcmService for Android/iOS push (topics + device tokens).
# firebase-admin dep stays in pom.xml; this flag only controls init.
# Steps to enable:
#   1. Go to https://console.firebase.google.com
#   2. Project Settings → Service Accounts → Generate New Private Key
#   3. Save the downloaded JSON as:
#      src/main/resources/firebase-service-account.json
#      (gitignored — do not commit)
#   4. Set enabled=true below (or SAMAJ_FIREBASE_ENABLED=true)
# ─────────────────────────────────────────────────────────
samaj.firebase.enabled=${SAMAJ_FIREBASE_ENABLED:false}
samaj.firebase.service-account-path=${SAMAJ_FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
